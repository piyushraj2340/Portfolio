  <text x="80" y="520" fill="#8A8A93" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22">Building robust, scalable web applications</text>
  <text x="1040" y="520" text-anchor="end" fill="#71717A" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">2+ years  |  India</text>
