  <text x="112" y="139" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="700">PR</text>

  <text x="162" y="124" fill="#A1A1AA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.08em">PORTFOLIO</text>
  <text x="162" y="150" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="500">piyushraj.me</text>

  <text x="80" y="280" fill="#60A5FA" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.16em">SOFTWARE ENGINEER</text>
